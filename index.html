<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SterilTrack — Centrales de Esterilización & Trazabilidad Quirúrgica ANMAT</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="./version.json">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col font-sans antialiased">

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});

  </script>

</html>
